services:
  db:
    image: postgres:16
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: riverbank
      POSTGRES_USER: riverbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/migrations/001_auth_baseline.sql:/docker-entrypoint-initdb.d/001_auth_baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverbank -d riverbank"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: riverbank
      PGUSER: riverbank
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local development}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      RIVERBANK_CORS_ORIGINS: ${RIVERBANK_CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
