name: riverbank-hackathon

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to the tested commit image}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    environment:
      RIVERBANK_ENVIRONMENT: production
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-}
      DB_SECRET_ID: ${DB_SECRET_ID:-}
      DB_SSLROOTCERT: /etc/ssl/certs/rds-global-bundle.pem
      S3_BUCKET: ${S3_BUCKET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://ezxriverbank-hackathon.vercel.app}
      AWS_METADATA_SERVICE_TIMEOUT: "2"
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: riverbank
      KAFKA_PASSWORD_FILE: /run/secrets/kafka_password
      KAFKA_TOPIC_PREFIX: riverbank-hackathon
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: riverbank
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_KEY_PREFIX: 'riverbank-hackathon:'
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    secrets:
      - kafka_password
      - redis_password
    networks: [default, services]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    platform: linux/arm64
    restart: unless-stopped
    environment:
      CLUSTER_ID: ZdNsElQOWIqRPlfAtvMQ5Q
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/run/secrets/kafka_server_jaas
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_BYTES: "33554432"
      KAFKA_LOG_SEGMENT_MS: "3600000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "60000"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks: [services]
    volumes:
      - kafka_data:/var/lib/kafka/data
    secrets:
      - kafka_server_jaas
      - kafka_client_properties
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka_client_properties >/dev/null 2>&1']
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  kafka-init:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    platform: linux/arm64
    restart: 'no'
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        for suffix in commands events dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --command-config /run/secrets/kafka_client_properties \
            --create --if-not-exists --partitions 3 --replication-factor 1 \
            --config retention.ms=86400000 --config retention.bytes=134217728 \
            --topic "riverbank-hackathon.$$suffix"
        done
    environment:
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    networks: [services]
    secrets:
      - kafka_client_properties
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    platform: linux/arm64
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    networks: [services]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    secrets:
      - redis_password
      - redis_acl
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --user riverbank ping | grep -qx PONG']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    mem_limit: 192m
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the API domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  kafka_data:
  redis_data:

networks:
  services:
    internal: true

secrets:
  kafka_password:
    file: ${SERVICE_SECRETS_DIR:-../.cache/services}/kafka_password
  kafka_server_jaas:
    file: ${SERVICE_SECRETS_DIR:-../.cache/services}/kafka_server_jaas
  kafka_client_properties:
    file: ${SERVICE_SECRETS_DIR:-../.cache/services}/kafka_client_properties
  redis_password:
    file: ${SERVICE_SECRETS_DIR:-../.cache/services}/redis_password
  redis_acl:
    file: ${SERVICE_SECRETS_DIR:-../.cache/services}/redis_acl
