name: riverbank-hackathon

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to the tested commit image}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    environment:
      RIVERBANK_ENVIRONMENT: production
    expose:
      - "8000"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the API domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
