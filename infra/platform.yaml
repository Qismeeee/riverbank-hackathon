AWSTemplateFormatVersion: '2010-09-09'
Description: Riverbank identity, private registry and bounded EC2 deployment roles. Reuses existing EC2/RDS/S3.
Parameters:
  EnableDeployment:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  FrontendOrigin:
    Type: String
    Default: https://ezxriverbank-hackathon.vercel.app
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  DataBucket:
    Type: String
    Default: riverbank-data-424016506356
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Default: i-06ab8a545deb7a7f3
  GitHubSubjectPrefix:
    Type: String
    Default: repo:Qismeeee@152834740/riverbank-hackathon@1440441629
  ExistingGitHubProviderArn:
    Type: String
    Default: ''
  ExistingKafkaSecretArn:
    Type: String
    Default: ''
  ExistingRedisSecretArn:
    Type: String
    Default: ''
Conditions:
  ProvisionDeployment: !Equals [!Ref EnableDeployment, 'true']
  CreateGitHubProvider: !And
    - !Condition ProvisionDeployment
    - !Equals [!Ref ExistingGitHubProviderArn, '']
  CreateKafkaCredential: !Equals [!Ref ExistingKafkaSecretArn, '']
  CreateRedisCredential: !Equals [!Ref ExistingRedisSecretArn, '']
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: riverbank-hackathon
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Project: riverbank-hackathon
  SellerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: seller
      Description: Seller access; backend must enforce seller/shop ownership.
  UnderwriterGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: underwriter
      Description: Bank staff; membership assigned only by an administrator.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: riverbank-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub '${FrontendOrigin}/auth/callback'
        - http://localhost:3000/auth/callback
      LogoutURLs:
        - !Ref FrontendOrigin
        - http://localhost:3000
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'riverbank-hackathon-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: LoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true
  KafkaCredential:
    Type: AWS::SecretsManager::Secret
    Condition: CreateKafkaCredential
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: riverbank-hackathon/kafka
      Description: Single-node Kafka SASL credential; never put in Compose env or logs.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"riverbank"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  RedisCredential:
    Type: AWS::SecretsManager::Secret
    Condition: CreateRedisCredential
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: riverbank-hackathon/redis
      Description: Redis ACL credential; independent of Kafka and database credentials.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"riverbank"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  Registry:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: riverbank-hackathon-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  RuntimeRole:
    Type: AWS::IAM::Role
    Condition: ProvisionDeployment
    Properties:
      RoleName: riverbank-hackathon-runtime
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/RiverbankHackathonRoleBoundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: riverbank-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !If [CreateKafkaCredential, !Ref KafkaCredential, !Ref ExistingKafkaSecretArn]
                  - !If [CreateRedisCredential, !Ref RedisCredential, !Ref ExistingRedisSecretArn]
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-1893a3d4-b65e-47a7-bb55-2134b3deaff7-*'
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/riverbank-hackathon/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !GetAtt Registry.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/riverbank-hackathon/app:log-stream:*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: RiverbankHackathon/Host
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  RuntimeProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: ProvisionDeployment
    Properties:
      InstanceProfileName: riverbank-hackathon-runtime
      Roles: [!Ref RuntimeRole]
  DeployRole:
    Type: AWS::IAM::Role
    Condition: ProvisionDeployment
    Properties:
      RoleName: riverbank-hackathon-deploy
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/RiverbankHackathonRoleBoundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateGitHubProvider, !Ref GitHubProvider, !Ref ExistingGitHubProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:environment:production'
      Policies:
        - PolicyName: riverbank-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:DescribeImages, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !GetAtt Registry.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/riverbank-hackathon/releases/*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/riverbank-hackathon-deploy'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation]
                Resource: '*'
      Tags:
        - Key: Project
          Value: riverbank-hackathon
  DeployCommand:
    Type: AWS::SSM::Document
    Condition: ProvisionDeployment
    Properties:
      Name: riverbank-hackathon-deploy
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Tags:
        - Key: Project
          Value: riverbank-hackathon
      Content:
        schemaVersion: '2.2'
        description: Deploy an immutable tested ECR commit to the selected Riverbank EC2.
        parameters:
          Mode:
            type: String
            default: deploy
            allowedValues: [deploy, verify]
          Image:
            type: String
            default: ''
            allowedPattern: !Sub '^$|^${AWS::AccountId}\.dkr\.ecr\.${AWS::Region}\.amazonaws\.com/riverbank-hackathon-api:[a-f0-9]{40}$'
        mainSteps:
          - action: aws:runShellScript
            name: Verify
            precondition:
              StringEquals: ['{{ Mode }}', verify]
            inputs:
              timeoutSeconds: '90'
              runCommand:
                - |
                    set -eu
                    domain=$(sed -n 's/^SITE_ADDRESS=//p' /opt/riverbank-hackathon/.env)
                    aws sts get-caller-identity --query Arn --output text
                    curl --fail --silent --show-error --max-time 10 "https://$domain/health"
                    curl --fail --silent --show-error --max-time 30 "https://$domain/ready"
          - action: aws:runShellScript
            name: Deploy
            precondition:
              StringEquals: ['{{ Mode }}', deploy]
            inputs:
              timeoutSeconds: '1800'
              runCommand:
                - !Sub |
                    #!/usr/bin/env bash
                    set -Eeuo pipefail
                    umask 077
                    unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
                    export AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null
                    image='{{ Image }}'
                    test -n "$image"
                    sha=$(printf '%s' "$image" | awk -F: '{print $NF}')
                    root=/opt/riverbank-hackathon
                    release="$root/releases/$sha"
                    registry_config=$(mktemp -d)
                    transfer=$(mktemp "$root/.release.XXXXXX.tar.gz")
                    cleanup() {
                      rm -f -- "$registry_config/config.json" "$transfer"
                      rmdir -- "$registry_config" || true
                    }
                    trap cleanup EXIT
                    mkdir -p "$release"
                    aws s3 cp 's3://${DataBucket}/riverbank-hackathon/releases/'"$sha"'/infra.tar.gz' "$transfer" --region '${AWS::Region}' --only-show-errors
                    tar -xzf "$transfer" -C "$release" --no-same-owner
                    python3 "$release/service_secrets.py" --aws --directory "$root/secrets" --region '${AWS::Region}'
                    aws ecr get-login-password --region '${AWS::Region}' | docker --config "$registry_config" login --username AWS --password-stdin '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
                    domain=$(sed -n 's/^SITE_ADDRESS=//p' "$root/.env")
                    DOCKER_CONFIG="$registry_config" bash "$release/deploy.sh" "$image" "https://$domain/health"
                    install -d -m 0750 "$root/operations"
                    install -m 0644 "$release/monitor_services.py" "$root/operations/monitor_services.py"
                    printf '%s\n' '* * * * * root /usr/bin/flock -n /run/riverbank-monitor.lock /usr/bin/python3 /opt/riverbank-hackathon/operations/monitor_services.py 2>&1 | /usr/bin/logger -t riverbank-monitor' > /etc/cron.d/riverbank-hackathon-monitor
                    chmod 0644 /etc/cron.d/riverbank-hackathon-monitor
                    python3 "$root/operations/monitor_services.py"
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  Issuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  JwksUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json'
  LoginBaseUrl:
    Value: !Sub 'https://riverbank-hackathon-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
  RegistryUri:
    Value: !GetAtt Registry.RepositoryUri
  DeployRoleArn:
    Condition: ProvisionDeployment
    Value: !GetAtt DeployRole.Arn
  RuntimeProfileName:
    Condition: ProvisionDeployment
    Value: !Ref RuntimeProfile
  KafkaSecretId:
    Value: !If [CreateKafkaCredential, !Ref KafkaCredential, !Ref ExistingKafkaSecretArn]
  RedisSecretId:
    Value: !If [CreateRedisCredential, !Ref RedisCredential, !Ref ExistingRedisSecretArn]
