[project]
name = "riverbank"
version = "0.1.0"
description = "Riverbank development foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.123",
    "fastapi>=0.115,<1",
    "pydantic-settings==2.16.2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<9",
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
