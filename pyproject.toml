[project]
name = "riverbank-hackathon"
version = "0.1.0"
description = "Riverbank API foundation"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.13.6"
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra"
